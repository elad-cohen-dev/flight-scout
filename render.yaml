services:
  - type: web
    name: flight-scout
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      - key: SERPAPI_MONTHLY_BUDGET
        sync: false
      - key: FLIGHT_SCOUT_EXTRACT_MODEL
        sync: false
      - key: FLIGHT_SCOUT_AI_BUDGET_USD
        sync: false
      - key: FLIGHT_SCOUT_PRICES_JSON
        sync: false
      # Optional: set FLIGHT_SCOUT_MODEL to override the default model,
      # TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID for Telegram alerts,
      # TELEGRAM_WEBHOOK_SECRET (+ optional PUBLIC_URL) for the two-way bot
