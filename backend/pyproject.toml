[project]
name = "flight-scout-backend"
version = "2.3.0"
description = "LangGraph agent that finds cheap flights on the web and serves them via FastAPI"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-core>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "libsql>=0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
